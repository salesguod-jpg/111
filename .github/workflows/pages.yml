name: Deploy Pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_call:
permissions: {}
concurrency:
  group: pages-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Check static site and size
        run: |
          python -m json.tool site/data/index.json > /dev/null
          python -m json.tool site/data/status.json > /dev/null
          test -f site/index.html
          test "$(du -sm site | cut -f1)" -lt 50
          date -u +'%Y-%m-%dT%H:%M:%SZ' > site/deployed-at.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Verify the deployed public website
        env:
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python - <<'PYVERIFY'
          import json, os, time, urllib.request
          base=os.environ['SITE_URL'].rstrip('/')+'/'
          for attempt in range(6):
              try:
                  page=urllib.request.urlopen(base,timeout=20).read().decode()
                  assert '投资情报中心' in page
                  data=json.load(urllib.request.urlopen(base+'data/index.json',timeout=20))
                  status=json.load(urllib.request.urlopen(base+'data/status.json',timeout=20))
                  print(f"::notice title=Public website verified::{base} HTTP 200; events={len(data['events'])}; last_collection={status.get('last_success_at')}; ai_mode={status.get('ai_mode')}")
                  break
              except Exception:
                  if attempt==5: raise
                  time.sleep(5)
          PYVERIFY
